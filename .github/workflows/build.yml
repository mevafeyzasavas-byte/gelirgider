name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova and icon tool
        run: npm install -g cordova cordova-res

      - name: Add Android platform
        run: cordova platform add android

      - name: Generate icons from source icon
        run: cordova-res android --skip-config --copy --type icon --android-project platforms/android

      - name: Build debug APK
        run: cordova build android --debug

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find platforms/android -name "*-debug.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: ${{ steps.apk.outputs.path }}
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
